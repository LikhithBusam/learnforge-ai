services:
  # -- API Web Service ---------------------------------------------------------
  - type: web
    name: learnforge-api
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: backend/src
      - key: PYTHON_VERSION
        value: "3.11"

  # -- Frontend Static Site ----------------------------------------------------
  - type: web
    name: learnforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable