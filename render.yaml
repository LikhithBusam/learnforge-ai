services:
  # -- API Web Service ---------------------------------------------------------
  - type: web
    name: learnforge-api
    runtime: python
    # Build runs from repo root where pyproject.toml lives.
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: backend/src
      - key: PYTHON_VERSION
        value: "3.11"
